# The Studio is its own install, not a package of the site's workspace.
#
# Without this file pnpm walks up to the repository root's
# pnpm-workspace.yaml and resolves *that* project as the current one, so
# `pnpm install` here installs the site's dependencies and leaves
# `studio/node_modules` empty — `sanity` never lands on PATH. Finding a
# workspace file stops the walk at this directory.
#
# esbuild (via Vite) is the one dependency here that needs its install script
# to run; pnpm blocks build scripts unless they are named.
allowBuilds:
  esbuild: true

name: Preview

# The draft preview: the same commit as production, deployed as a Cloudflare
# Worker that renders each request from Sanity's *drafts* and lets nobody past
# who is not a GDG member.
#
# A separate workflow from `build.yml` on purpose. That one carries no
# SANITY_READ_TOKEN and must not gain one — GitHub Pages serves whatever it is
# handed, to whoever asks. This one is the only place the token belongs, and
# the Worker in `preview/` is what makes that safe.
#
# Note what this job does *not* do: read any content. The preview build
# registers every collection empty and fetches while it renders, so there is no
# copy of the CMS baked into what is uploaded here, and no read token in this
# job's build step. The token is a Worker secret, pushed below, and it is read
# inside the isolate that renders the page.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Step 2, once a Sanity webhook is pointed at
  # /repos/gdg-jp/devfest26/dispatches with {"event_type": "content-draft"}:
  # saving a draft in the Studio reaches the preview without a push. The
  # trigger is here already so that wiring is a Sanity-side change only.
  #
  # Less urgent than it was. The deployed Worker re-reads Sanity on every
  # request, so a saved draft shows up on the next reload without any deploy at
  # all; this only matters when the *code* changes.
  repository_dispatch:
    types: [content-draft]

# A burst of draft saves should collapse into one deploy of the latest content.
concurrency:
  group: preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    # Scopes the read token and the Cloudflare credentials to this one job, and
    # is where a required reviewer would go if the preview ever needs one.
    environment:
      name: preview
      url: ${{ vars.PREVIEW_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # A missing token is not a smaller preview, it is a silent copy of
      # production wearing a preview URL — the one outcome that would make an
      # editor trust "my draft is not in there yet". The deployed Worker
      # refuses to serve without it too (see `missingConfig` in
      # `preview/src/index.ts`); this is the earlier, louder half of the same
      # rule.
      - name: Refuse to deploy a preview that cannot read drafts
        env:
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SANITY_READ_TOKEN:-}" ]; then
            echo "::error::SANITY_READ_TOKEN is not set on the 'preview' environment; this build would render published content only"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # No TARGETS: one deployment, the front page and every city in it. The
      # routes are resolved per request, so which cities exist is a question
      # the Studio answers at the moment someone asks — not one this build
      # freezes in.
      #
      # `astro check` is deliberately skipped: `build.yml` already ran it on
      # this commit, and what differs here is content, which nothing at build
      # time even reads.
      - name: Build the preview Worker
        env:
          PREVIEW: "1"
          SITE_URL: ${{ vars.PREVIEW_URL }}
        run: pnpm exec astro build

      # Presentation: the Studio again, this time served from the preview's own
      # origin at /studio so its preview iframe carries the session cookie —
      # see `serveStudio` in `preview/src/index.ts` for why that is not
      # optional. It goes straight into the adapter's client output, which is
      # what `wrangler deploy` uploads as this Worker's assets, so it has to
      # run *after* `astro build` — that step recreates the directory.
      #
      # The same source and the same commit as `studio.yml` publishes to
      # devfest26.sanity.studio, so the two cannot drift. `studio/` is outside
      # the root workspace and keeps its own lockfile, hence the separate
      # install.
      #
      # SANITY_STUDIO_PREVIEW_ORIGIN is what turns the Presentation tool on;
      # the deployed Studio has it unset and shows no Presentation tab, because
      # a cross-site iframe of the preview could never load.
      - name: Install the Studio's dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile

      - name: Build the Studio into the preview
        working-directory: studio
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}
          # Read by the CLI, which sets Vite's `base` and hands the same
          # value to `renderStudio` so the Studio's own router agrees with
          # where it is mounted. Not a `sanity.config.ts` option: `basePath`
          # there is the workspace's URL segment, which is a different thing
          # and would be a second prefix on top of this one.
          SANITY_STUDIO_BASEPATH: /studio
          SANITY_STUDIO_PREVIEW_ORIGIN: ${{ vars.PREVIEW_URL }}
        run: pnpm exec sanity build ../dist/all/client/studio

      # The CLI applies the base path to its scripts and stylesheets but not to
      # the four links in the head — favicons and the web manifest — which come
      # out as `/static/...` and would be asked of the site rather than of the
      # Studio. Nothing breaks; it is four 404s on every load of a tool that
      # gets reloaded a lot. A no-op if the CLI ever starts writing them
      # correctly.
      - name: Point the Studio's icons at the Studio
        run: |
          sed -i 's|href="/static/|href="/studio/static/|g'             dist/all/client/studio/index.html

      # `dist/all/server/wrangler.json` is what the adapter wrote: the gate as
      # `main`, the client build as the asset directory, and everything from
      # `preview/wrangler.jsonc` carried through. Deploying the source config
      # instead would upload the gate with no site behind it.
      #
      # The two Sanity identifiers are public — a project id is in every image
      # URL the site serves — but they live in repository variables rather than
      # in the committed config, so they are passed here.
      #
      # The two OIDC secrets are set once by hand and survive every deploy, so
      # CI never sees them. See `preview/README.md`.
      - name: Deploy the Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy \
            --config dist/all/server/wrangler.json \
            --var SANITY_PROJECT_ID:'${{ vars.SANITY_PROJECT_ID }}' \
            --var SANITY_DATASET:'${{ vars.SANITY_DATASET }}'

      # The read token, unlike the OIDC secrets, already lives in this
      # environment — it is what the guard above checks — so it is pushed from
      # here rather than kept in a second place that has to be rotated
      # separately. After the deploy, because a secret needs a Worker to belong
      # to; on a first deploy that leaves a few seconds in which the gate
      # serves its setup page, which is the correct thing for it to do.
      - name: Give the Worker its read token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$SANITY_READ_TOKEN" | pnpm exec wrangler secret put \
            SANITY_READ_TOKEN --config dist/all/server/wrangler.json

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sanity (or any other CMS) triggers a rebuild by POSTing to
  # /repos/gdg-jp/devfest26/dispatches with a token and
  # {"event_type": "content-published"}. GitHub Actions cannot receive an
  # arbitrary webhook directly, so this is the entry point for one.
  repository_dispatch:
    types: [content-published]

# A burst of CMS publishes should collapse into a single deploy of the latest
# content rather than queueing one build per edit. Pull requests are keyed by
# their own ref so they only ever cancel themselves.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per build target: each city, plus the portal that lists them. They
# are independent builds of the same commit, so a failure in one does not hide
# another's result — but all three make up one site, and `assemble` waits for
# every one of them.
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: kansai
            tenant: kansai
            portal: ""
          - target: tokyo
            tenant: tokyo
            portal: ""
          # No tenant: the portal is the root page and belongs to no city.
          - target: portal
            tenant: ""
            portal: "1"

    env:
      TENANT: ${{ matrix.tenant }}
      PORTAL: ${{ matrix.portal }}
      # Repository variable. One origin now covers every target: the cities are
      # mounted under /kansai and /tokyo on the same host as the portal. Unset
      # is not an error — canonical/OG/JSON-LD absolute URLs are omitted rather
      # than wrong.
      SITE_URL: ${{ vars.SITE_URL }}
      # Also repository variables, not secrets: the project id and dataset name
      # are public information, and `src/lib/sanity/env.ts` falls back to the
      # Markdown in `src/content/` when the project id is absent. Deliberately
      # no SANITY_READ_TOKEN — that one reads drafts, which must never reach a
      # published build.
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types and content-collection schemas, scoped to this target.
      - run: pnpm exec astro check

      - run: pnpm exec astro build

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  # The three builds are three separate sites on disk. This is where they
  # become one: the portal at the root, each city on its own path. Astro's
  # `base` already wrote every internal link to match this layout, so the
  # directory names here are not cosmetic — renaming one breaks that city's
  # links.
  assemble:
    name: assemble
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay the three builds out as one site
        run: |
          mkdir -p _site
          cp -r artifacts/site-portal/. _site/
          cp -r artifacts/site-kansai _site/kansai
          cp -r artifacts/site-tokyo _site/tokyo
          find _site -maxdepth 2 -name index.html

      # Pages takes exactly one artifact, under the fixed name `github-pages`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: assemble
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build

on:
  # A push to `main` is the deploy. The site is the Markdown in `src/content/`,
  # built and pushed to `gh-pages` by the `publish` job below. A pull request
  # only proves that the merge result still builds — two pull requests that
  # were each green apart can break together — and stops there.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: "作り直す開催地。空欄で全部。例: kansai tokyo"
        required: false
        type: string
      # For the day one half-written session must not hold the rest of the
      # city back. Off, a content rule broken anywhere fails that city's job and
      # its published pages stay as they were; on, the entry that breaks it is
      # left off the page — the way the draft preview leaves it off — and the
      # rule goes on the run's summary as a warning. Only here, never from the
      # Studio: it is a decision to look at, not a default to reach for. See
      # `reject` in `src/preview/problems.ts`.
      ignore_warnings:
        description: "すべての警告を無視して公開する（ルールに反する項目はページから外れます）"
        required: false
        type: boolean
        default: false
  # Left in place so an old Studio webhook still starts a build. It publishes
  # the same checked-in Markdown as a push to `main`; nothing is read from Sanity.
  repository_dispatch:
    types: [deploy]

# One production deploy at a time, and they queue rather than cancel each other.
# A push to `main`, a manual run, and a leftover dispatch all write `gh-pages`,
# so two of them at once would race. Cancelling would be cheaper but wrong when
# a run carries a subset of cities: a newer run would take the older one's
# build down with it and never put it back.
#
# Pull requests only check. They are keyed by their own ref and do cancel:
# there the newest commit subsumes the ones before it, and keeping them out of
# the production queue means a check does not delay a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Repository variable. One origin covers every target: the cities are mounted
  # under /kansai and /tokyo on the same host as the front page. Unset is not an
  # error — canonical/OG/JSON-LD absolute URLs are omitted rather than wrong.
  SITE_URL: ${{ vars.SITE_URL }}
  # Repository variables, not secrets: the project id and dataset name are
  # public. Discovery and every city but Kansai still read Sanity, so a city
  # that only exists in the Studio (Sapporo, Tokyo) stays on the site. Kansai
  # does not: its job clears these two before it builds, and with them unset
  # `src/lib/sanity/env.ts` reads `src/content/kansai` — the same files a local
  # build with no `SANITY_PROJECT_ID` reads. Deliberately no SANITY_READ_TOKEN.
  # That one reads drafts, which must never reach a published build.
  SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
  SANITY_DATASET: ${{ vars.SANITY_DATASET }}
  # Google Analytics — the site-wide property every page reports to. A city's
  # own property, if its chapter runs one, is a field on its `event` document
  # instead, so a chapter can set one up without repository access.
  #
  # A repository variable, same as SITE_URL: a measurement
  # id is printed into every page of the published HTML, so it is not a secret.
  # Unset is not an error — the tag is then absent entirely rather than
  # pointing at nothing, which is what keeps local builds and pull request
  # builds out of the numbers without anyone remembering to. `preview.yml`
  # deliberately has no counterpart: the draft preview is behind a sign-in gate
  # and is not measured. See `src/lib/analytics.ts`.
  GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

# One job per target the deploy asked for: those cities, plus the front page
# that lists them. They are independent builds of the same commit, and that is
# the point — a city whose `event` document is half-edited takes its own job
# down and nothing else with it. `publish` then grafts the jobs that succeeded
# onto the branch GitHub Pages serves, and leaves the rest exactly as they were,
# which covers both the cities that failed and the cities nobody asked for.
jobs:
  # Two questions, both for the CMS rather than for this file: which cities
  # exist, and which of them this run was asked to rebuild. Nothing is installed
  # here — `scripts/discover-targets.mjs` runs on a bare checkout, which is why
  # `src/tenants/discovery.ts` uses plain fetch and no zod.
  discover:
    name: discover
    runs-on: ubuntu-latest

    outputs:
      # Every city the CMS holds. `publish` takes down the published
      # directories that are *not* in here, so it is deliberately not narrowed
      # to the cities being rebuilt.
      cities: ${{ steps.list.outputs.cities }}
      # Every (language, target) pair this run rebuilds — the subset of
      # cities plus the front page, crossed with every language. Drives the
      # matrix directly via `include:`.
      builds: ${{ steps.list.outputs.builds }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - id: list
        env:
          # Through the environment rather than into the script body: the
          # dispatch carries a list written by whoever can edit the CMS, and
          # `${{ }}` would paste it into the shell as code. The script reads it
          # there and keeps only the names that are actually cities.
          DEPLOY_TARGETS: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.targets) || inputs.targets }}
          # For the log only, so that a run can say who asked for it.
          DEPLOY_BY: ${{ github.event.client_payload.by }}
        run: node --experimental-strip-types scripts/discover-targets.mjs

  build:
    name: build (${{ matrix.lang }}/${{ matrix.target }})
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      # The requirement, in one line: one (language, city) pair's failure
      # must not cancel another's build — a broken English translation must
      # not take the Japanese build down with it, or the other way round.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.builds) }}

    env:
      TARGETS: ${{ matrix.target }}
      SITE_LANG: ${{ matrix.lang }}
      # A city whose configuration does not validate fails the job rather than
      # being quietly skipped. The red job is the signal `publish` reads as
      # "leave that city's published pages where they are".
      STRICT_TENANTS: "1"
      # Empty on every event but a manual run with the box ticked, which is
      # what keeps pull requests and pushes to `main` strict.
      IGNORE_CONTENT_WARNINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_warnings && '1' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Kansai is not edited in the Studio. The workflow env above still
      # names the project, because discovery and the other cities need it.
      # Leaving it set on this job would publish the CMS copy of Kansai, which
      # is how the live city drifted away from `src/content/kansai`. Clearing
      # it is what `sanityEnabled()` reads as "build from the Markdown".
      - name: Build Kansai from the repository
        if: matrix.target == 'kansai'
        run: |
          echo "SANITY_PROJECT_ID=" >> "$GITHUB_ENV"
          echo "SANITY_DATASET=" >> "$GITHUB_ENV"

      # `shell: bash` for its `pipefail`, which the default shell does not set:
      # without it `tee` would answer for the pipeline and a failed build would
      # look green.
      #
      # Types and content-collection schemas, scoped to this target.
      # `unset` as well as the step above: a variable set on the workflow is
      # re-applied to each step, and an empty `GITHUB_ENV` value is still set.
      - name: Check
        shell: bash
        run: |
          if [ "$TARGETS" = "kansai" ]; then unset SANITY_PROJECT_ID SANITY_DATASET; fi
          pnpm exec astro check 2>&1 | tee -a build.log

      - name: Build
        shell: bash
        run: |
          if [ "$TARGETS" = "kansai" ]; then unset SANITY_PROJECT_ID SANITY_DATASET; fi
          pnpm exec astro build 2>&1 | tee -a build.log

      # GitHub hands raw job logs to a token and to nothing else, and the Studio
      # has no token — it reads this repository unauthenticated, from a browser.
      # Annotations it *can* read, so the tail of the failure is copied into
      # one. Without this step「サイトに反映」can say that 関西 failed and not one
      # word about why.
      - name: Copy the failure into an annotation the Studio can read
        if: failure()
        env:
          # Not `${{ matrix.target }}` in an argument: the slug comes from the
          # CMS, and the environment is where CMS strings belong.
          TARGET: ${{ matrix.lang }}/${{ matrix.target }}
        run: node scripts/annotate-failure.mjs build.log

      # A failed job uploads nothing, and that absence is how `publish` tells
      # the two apart. Nothing else reports per-target success. Named and
      # pathed by both lang and target, matching `targetKey` in
      # `src/tenants/selection.ts` — that is what decides `outDir`.
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.lang }}-${{ matrix.target }}
          path: dist/${{ matrix.lang }}-${{ matrix.target }}
          if-no-files-found: error

  # The publish branch is the site: repository Settings → Pages serves
  # `gh-pages` at the root, and GitHub's own pages-build-deployment picks up
  # every push to it. Nothing in this workflow deploys.
  #
  # `always()`, because running when some of the builds failed is this job's
  # entire purpose. It replaces what succeeded and leaves what did not, which is
  # what keeps a broken city's previously published pages answering.
  publish:
    name: publish
    needs: [discover, build]
    # Not `always()` on its own. This job deletes the cities that discovery did
    # not name, so it must not run on a discovery that never answered. It runs
    # for every event except a pull request: a push to `main` publishes the
    # Markdown in the commit, and a manual run or a leftover dispatch does the
    # same. A pull request builds and stops.
    if: ${{ always() && needs.discover.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: site
          # Every branch, so `origin/gh-pages` is there to switch to.
          fetch-depth: 0

      - name: Move to the publish branch, creating it on the first run
        working-directory: site
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . > /dev/null
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Graft the builds that succeeded onto the published site
        env:
          # Two lists, and telling them apart is what makes a deploy of one city
          # safe. `cities` is every city the CMS holds and decides what comes
          # *down*. `builds` is what this run actually rebuilt — every (language,
          # target) pair — and decides what goes *up*. Reading the second where
          # the first belongs would take every city nobody asked for off the site.
          CITIES_JSON: ${{ needs.discover.outputs.cities }}
          BUILDS_JSON: ${{ needs.discover.outputs.builds }}
        run: |
          set -euo pipefail

          # Parsed into files rather than through a process substitution: a
          # `mapfile < <(...)` swallows the exit status, and a list that
          # silently came out empty would make every step below read as "the
          # CMS has no cities" and delete all of them.
          jq -r '.[]' <<< "$CITIES_JSON" > cities.txt
          jq -r '.[] | "\(.lang) \(.target)"' <<< "$BUILDS_JSON" > builds.txt
          mapfile -t cities < cities.txt
          mapfile -t builds < builds.txt
          if [ "${#builds[@]}" -eq 0 ]; then
            echo "::error::discover produced no builds; refusing to publish"
            exit 1
          fi

          # Was this (language, target) pair part of what the deploy asked
          # for? The answer is how a missing artifact is read: a pair nobody
          # asked for did not build because there was nothing to build, and
          # that is not a failure.
          rebuilt() { printf '%s\n' "${builds[@]}" | grep -qxF "$1 $2"; }

          # Which root directories are cities rather than the front page's own
          # output, as recorded by the previous run. Inferring it from the
          # listing would eventually mistake one for the other.
          mapfile -t published < <(cat site/.cities 2>/dev/null || true)

          # An empty `cities` is a claim that the CMS holds no events at all.
          # That is a real answer for a new dataset, and it is also what a
          # query that stopped matching looks like — a field renamed, a
          # localization migration applied to the schema but not yet to the
          # documents. The two are indistinguishable from here, but the
          # published site is not: if it was serving cities a moment ago,
          # every one of them is about to be deleted, and that is not a
          # decision an automatic run should take on its own. Run the deploy
          # again once discovery finds them, or once they are genuinely gone
          # and `.cities` has caught up.
          if [ "${#cities[@]}" -eq 0 ] && [ "${#published[@]}" -gt 0 ]; then
            echo "::error::discovery found no cities, but ${#published[@]} are published (${published[*]}). Refusing to publish."
            exit 1
          fi

          # A city deleted from the CMS should stop being served, in both
          # languages. Against `cities` and not `builds`: a city left out of
          # this deploy is still a city, and its pages stay exactly where
          # they are.
          for slug in "${published[@]}"; do
            if [ -n "$slug" ] && ! printf '%s\n' "${cities[@]}" | grep -qxF "$slug"; then
              echo "removing /$slug and /en/$slug — no longer an event in the CMS"
              rm -rf "site/$slug" "site/en/$slug"
            fi
          done

          # Each city, in each language, if its job produced anything. A
          # `TARGETS=<slug> SITE_LANG=<lang>` build writes that city under
          # `<slug>/` (or `en/<slug>/`) with its own assets inside it — see
          # `soleCity` in `src/tenants/selection.ts` — so the directory is
          # self-contained and swaps in whole.
          for slug in "${cities[@]}"; do
            if [ -d "artifacts/site-ja-$slug/$slug" ]; then
              echo "replacing /$slug"
              rm -rf "site/$slug"
              cp -r "artifacts/site-ja-$slug/$slug" "site/$slug"
            elif ! rebuilt ja "$slug"; then
              echo "leaving /$slug as it was — not part of this deploy"
            else
              echo "::warning::$slug (ja) did not build; leaving the published copy in place"
            fi

            if [ -d "artifacts/site-en-$slug/en/$slug" ]; then
              echo "replacing /en/$slug"
              mkdir -p site/en
              rm -rf "site/en/$slug"
              cp -r "artifacts/site-en-$slug/en/$slug" "site/en/$slug"
            elif ! rebuilt en "$slug"; then
              echo "leaving /en/$slug as it was — not part of this deploy"
            else
              echo "::warning::$slug (en) did not build; leaving the published copy in place"
            fi
          done

          # The front page owns the root, which is also where the files every
          # city shares live (public/og, public/favicon). It is replaced
          # wholesale so a deleted file actually disappears; the city
          # directories, `en/`, the git metadata and the two markers are what
          # survive the prune.
          if [ -d artifacts/site-ja-portal ]; then
            echo "replacing the front page and the shared assets"
            prune=(! -name .git ! -name .nojekyll ! -name .cities ! -name CNAME ! -name en)
            for slug in "${cities[@]}"; do prune+=(! -name "$slug"); done
            find site -mindepth 1 -maxdepth 1 "${prune[@]}" -exec rm -rf {} +
            cp -r artifacts/site-ja-portal/. site/
          else
            echo "::warning::the front page (ja) did not build; leaving the published copy in place"
          fi

          # The English front page. Pruned the same way the Japanese one is,
          # and for the same reason: `site/en/<city>` was just grafted by the
          # loop above, and a plain `rm -rf site/en` here would take it
          # straight back out.
          #
          # Its own `_astro/` (and `og/`, `favicon/`, …) are the same public
          # assets the Japanese build just published, content-hashed the same
          # way if their content matches — `cp -n` only adds what is not
          # already there rather than risking two different files landing on
          # the same hashed name.
          if [ -d artifacts/site-en-portal/en ]; then
            echo "replacing /en (front page)"
            mkdir -p site/en
            prune=(! -name .git ! -name .nojekyll ! -name .cities ! -name CNAME)
            for slug in "${cities[@]}"; do prune+=(! -name "$slug"); done
            find site/en -mindepth 1 -maxdepth 1 "${prune[@]}" -exec rm -rf {} +
            cp -r artifacts/site-en-portal/en/. site/en/
            if [ -d artifacts/site-en-portal/_astro ]; then
              mkdir -p site/_astro
              cp -rn artifacts/site-en-portal/_astro/. site/_astro/
            fi
          else
            echo "::warning::the front page (en) did not build; leaving the published copy in place"
          fi

          # Astro writes its assets to `_astro/`, and Jekyll drops every path
          # beginning with an underscore. Without this the site loses its CSS.
          touch site/.nojekyll
          printf '%s\n' "${cities[@]}" > site/.cities

          find site -mindepth 1 -maxdepth 3 -name index.html | sort

      - name: Push
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "nothing changed; not publishing"
            exit 0
          fi

          git commit -m "publish: ${{ github.sha }}"

          # `concurrency` already serialises production runs, so a conflict here
          # means something pushed to the branch by hand. One rebase, then fail
          # loudly rather than looping.
          git push origin gh-pages || {
            git pull --rebase origin gh-pages
            git push origin gh-pages
          }

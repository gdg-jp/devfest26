name: PR Preview cleanup

# The other half of the `pr-preview` job in `build.yml`. When a pull request
# closes — merged or not — its Workers Preview is deleted, and the comment that
# pointed at it says so. A Preview that outlived its pull request would go on
# serving pages that are by now either on the real site or never will be.
#
# A workflow of its own because `build.yml` must not run on `closed`: every job
# there would have to learn to skip it.
on:
  pull_request:
    types: [closed]

# The very group that pull request's `Build` run is in — `build.yml` keys pull
# requests by workflow name and ref, and `github.ref` here is the same pull
# request ref — so closing cancels a build still on its way to `pr-preview`.
# Left running, it would upload a Preview right after this deleted it.
# Renaming the `Build` workflow breaks this; keep the two in step.
concurrency:
  group: Build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  delete:
    name: delete
    # The same pull requests `pr-preview` uploads for. `github.actor` is
    # whoever closed it: a Dependabot pull request merged by a person gets
    # here, finds nothing to delete, and says nothing.
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    # For its credentials. GitHub records this as one more deployment to the
    # environment, with no URL — which is what the pull request should show
    # once the Preview is gone.
    environment:
      name: pr-preview

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v7

      - name: Check for the Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Nothing deleted: the 'pr-preview' environment needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable. See pr-preview/README.md."
          fi

      - uses: pnpm/setup@v3
        if: steps.credentials.outputs.ready == 'true'
        with:
          cache: true
          require-lockfile: true

      # A Preview that is not there is not a failure. Pull requests closed
      # before any preview existed, ones whose build never got that far, and
      # the first close before the Worker itself exists all end up here; the
      # two codes are Cloudflare's "no such Worker" and "no such Preview".
      # Anything else — a token that cannot delete, say — still fails, because
      # it leaves a public Preview behind.
      - name: Delete the Preview
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if pnpm exec wrangler preview delete \
            --config pr-preview/wrangler.jsonc \
            --name "pr-$PR_NUMBER" \
            --skip-confirmation 2>&1 | tee delete.log; then
            :
          elif grep -qE '\[code: (10007|10025)\]' delete.log; then
            echo "pr-$PR_NUMBER was not there to delete"
          else
            exit 1
          fi

      - name: Say so on the pull request
        if: steps.credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "### 🔍 プレビュー（削除済み）" \
            "" \
            "プルリクエストが閉じられたため、プレビュー \`pr-$PR_NUMBER\` を削除しました。開き直すと、次のビルドでもう一度作られます。" \
            | bash scripts/pr-preview.sh comment --update-only
